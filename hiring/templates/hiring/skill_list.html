{% extends "base.html" %}

{% block title %}Skills{% endblock %}

{% block content %}
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold">Skills</h1>
    <a href="{% url 'hiring:skill_create' %}" class="btn btn-primary btn-sm">Add skill</a>
  </div>
  <div class="card bg-base-100 shadow-sm mt-6">
    <div class="card-body p-0">
      {% if skills %}
        <table class="table">
          <thead>
            <tr><th>Name</th><th class="text-right">Jobs</th><th></th></tr>
          </thead>
          <tbody>
            {% for skill in skills %}
              <tr>
                <td class="font-medium">{{ skill.name }}</td>
                <td class="text-right">{{ skill.job_count }}</td>
                <td class="text-right"><a href="{% url 'hiring:skill_edit' skill.pk %}" class="btn btn-ghost btn-xs">Edit</a></td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      {% else %}
        <p class="p-6 text-base-content/60">No skills yet.</p>
      {% endif %}
    </div>
  </div>
{% endblock %}
